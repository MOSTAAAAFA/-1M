<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0C06A"/>
      <stop offset="50%" style="stop-color:#C9A84C"/>
      <stop offset="100%" style="stop-color:#B5923C"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="#050507"/>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#goldG)" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#goldG)" stroke-width="0.5" opacity="0.4"/>
  <!-- 1M monogram -->
  <text x="100" y="115" font-family="Georgia, serif" font-size="60" font-weight="700" fill="url(#goldG)" text-anchor="middle" letter-spacing="2">1M</text>
  <!-- Small accent dots -->
  <circle cx="62" cy="130" r="1.5" fill="#C9A84C" opacity="0.6"/>
  <circle cx="138" cy="130" r="1.5" fill="#C9A84C" opacity="0.6"/>
</svg>
