<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>1M Motors — Hero Banner</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #050507;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    .hero-banner {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 120px;
      overflow: hidden;
    }

    /* Background gradient layers */
    .hero-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 70% 50%, rgba(201,168,76,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 30% 70%, rgba(201,168,76,0.05) 0%, transparent 50%),
        linear-gradient(135deg, #050507 0%, #0a0a0e 50%, #050507 100%);
      z-index: 1;
    }

    /* Gold vignette */
    .hero-banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(5,5,7,0.8) 100%);
      z-index: 2;
    }

    /* Content */
    .content {
      position: relative;
      z-index: 10;
      max-width: 800px;
    }

    .eyebrow {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #C9A84C;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .eyebrow::before {
      content: '';
      width: 40px;
      height: 1px;
      background: linear-gradient(to right, transparent, #C9A84C);
    }

    .headline {
      font-size: clamp(48px, 5vw, 80px);
      font-weight: 300;
      line-height: 1.1;
      color: #F0EDE8;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    .headline .gold {
      background: linear-gradient(135deg, #F4D03F 0%, #E0C06A 50%, #C9A84C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 600;
    }

    .sub {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: rgba(240,237,232,0.62);
      line-height: 1.65;
      margin-bottom: 40px;
      max-width: 500px;
    }

    .cta-group {
      display: flex;
      gap: 16px;
    }

    .btn-gold {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 16px 40px;
      background: linear-gradient(135deg, #C9A84C 0%, #E0C06A 50%, #F4D03F 100%);
      color: #050507;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(201,168,76,0.4);
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 16px 40px;
      background: rgba(201,168,76,0.08);
      color: #F0EDE8;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      border: 1px solid rgba(201,168,76,0.4);
      border-radius: 6px;
      cursor: pointer;
    }

    /* Logo mark */
    .logo-area {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo-circle {
      width: 160px;
      height: 160px;
      background: linear-gradient(135deg, #C9A84C 0%, #E0C06A 50%, #F4D03F 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      font-size: 64px;
      font-weight: 900;
      color: #000;
      box-shadow:
        0 8px 40px rgba(201,168,76,0.6),
        0 0 80px rgba(244,208,63,0.4),
        0 0 120px rgba(201,168,76,0.3),
        inset 0 2px 6px rgba(255,255,255,0.4),
        inset 0 -2px 6px rgba(0,0,0,0.2);
      border: 3px solid rgba(255,255,255,0.3);
      position: relative;
    }

    .logo-circle::after {
      content: '';
      position: absolute;
      top: 15%;
      left: 20%;
      width: 50%;
      height: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, transparent 60%);
      border-radius: 50%;
      pointer-events: none;
    }

    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: rgba(201,168,76,0.9);
    }

    /* Decorative elements */
    .gold-line-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(to right, transparent, #C9A84C, #E0C06A, #C9A84C, transparent);
      z-index: 10;
    }

    .gold-line-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(to right, transparent, #C9A84C, #E0C06A, #C9A84C, transparent);
      z-index: 10;
    }

    .dotted-grid {
      position: absolute;
      bottom: 80px;
      left: 120px;
      width: 200px;
      height: 100px;
      background-image: radial-gradient(circle, rgba(201,168,76,0.3) 1px, transparent 1px);
      background-size: 20px 20px;
      z-index: 5;
      opacity: 0.5;
    }

    /* Floating particles */
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #C9A84C;
      border-radius: 50%;
      z-index: 5;
      opacity: 0.6;
      animation: float 6s ease-in-out infinite;
    }

    .particle:nth-child(1) { top: 20%; left: 15%; animation-delay: 0s; }
    .particle:nth-child(2) { top: 60%; left: 25%; animation-delay: 1s; }
    .particle:nth-child(3) { top: 30%; left: 70%; animation-delay: 2s; }
    .particle:nth-child(4) { top: 70%; left: 80%; animation-delay: 3s; }
    .particle:nth-child(5) { top: 40%; left: 50%; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px); opacity: 0.6; }
      50% { transform: translateY(-20px); opacity: 1; }
    }

    /* Vignette overlay */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(5,5,7,0.6) 100%);
      z-index: 3;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="hero-banner">
    <!-- Decorative -->
    <div class="gold-line-top"></div>
    <div class="gold-line-bottom"></div>
    <div class="dotted-grid"></div>
    <div class="vignette"></div>

    <!-- Particles -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <!-- Content -->
    <div class="content">
      <div class="eyebrow">1M MOTORS</div>
      <h1 class="headline">
        Where Engineering<br>
        Becomes <span class="gold">Emotion</span>
      </h1>
      <p class="sub">
        Experience the pinnacle of automotive excellence. Each vehicle curated for those who demand precision, luxury, and uncompromising performance.
      </p>
      <div class="cta-group">
        <button class="btn-gold">Explore Collection</button>
        <button class="btn-ghost">Book Test Drive</button>
      </div>
    </div>

    <!-- Logo -->
    <div class="logo-area">
      <div class="logo-circle">1M</div>
      <div class="logo-text">MOTORS</div>
    </div>
  </div>
</body>
</html>
